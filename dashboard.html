<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stroke Risk Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f8fbff, #eef4ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: fadeIn 1s ease;
      overflow-x: hidden;
      position: relative;
    }
    .bg-shape {
      position: fixed;
      border-radius: 50%;
      filter: blur(30px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
      z-index: 0;
    }
    .shape1 { width: 220px; height: 220px; background: #93c5fd; top: 5%; left: 8%; }
    .shape2 { width: 180px; height: 180px; background: #67e8f9; bottom: 10%; right: 8%; animation-delay: 2s; }
    .shape3 { width: 140px; height: 140px; background: #86efac; top: 45%; right: 20%; animation-delay: 4s; }
    .card {
      width: 92%;
      max-width: 950px;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(10px);
      padding: 32px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(30, 64, 175, 0.14);
      border: 1px solid #dbeafe;
      animation: slideUp 0.8s ease;
      position: relative;
      overflow: hidden;
      z-index: 1;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 6px;
      background: linear-gradient(90deg, #2563eb, #06b6d4, #10b981);
    }
    h1 { text-align: center; margin-bottom: 25px; color: #1e3a8a; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    input, select, textarea {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 12px;
      transition: 0.3s; background: #f8fafc;
    }
    textarea { min-height: 90px; resize: vertical; }
    input:focus, select:focus, textarea:focus {
      border-color: #2563eb; outline: none; transform: scale(1.02);
      box-shadow: 0 0 0 4px rgba(37,99,235,0.08); background: white;
    }
    .full { grid-column: 1 / -1; }
    button {
      width: 100%; margin-top: 20px; padding: 14px; border: none; border-radius: 14px;
      font-size: 16px; font-weight: bold; cursor: pointer;
      background: linear-gradient(90deg, #2563eb, #06b6d4);
      color: white; transition: 0.3s;
    }
    button:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 10px 22px rgba(37,99,235,0.2);
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes float {
      0%,100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-20px) translateX(10px); }
    }
  </style>
</head>
<body>
  <div class="bg-shape shape1"></div>
  <div class="bg-shape shape2"></div>
  <div class="bg-shape shape3"></div>
  <div class="card">
    <h1>🧠 Stroke Awareness and Risk Management Health Dashboard</h1>
    <form action="/submit_health" method="POST">
      <div class="grid">
        <input type="number" name="age" placeholder="Age" required />
        <select name="gender" required>
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
        </select>
        <input type="text" name="height" placeholder="Height (cm)" required />
        <input type="text" name="weight" placeholder="Weight (kg)" required />
        <input type="text" name="bp" placeholder="Blood Pressure" required />
        <input type="text" name="sugar" placeholder="Sugar Level" required />
        <select name="smoking" required>
          <option value="">Smoking</option>
          <option>Yes</option>
          <option>No</option>
        </select>
        <select name="alcohol" required>
          <option value="">Alcohol</option>
          <option>Yes</option>
          <option>No</option>
        </select>
        <select name="stress" required>
          <option value="">Stress Level</option>
          <option>Low</option>
          <option>Medium</option>
          <option>High</option>
        </select>
        <select name="family_history" required>
          <option value="">Family History</option>
          <option>Yes</option>
          <option>No</option>
        </select>
              <textarea class="full" name="extra_problems" placeholder="Any extra medical problems? (thyroid, kidney issues, migraines, etc.)"></textarea>
      </div>
      <button type="submit">Analyze Stroke Risk</button>
    </form>
  </div>
</body>
</html>
