<!DOCTYPE html>
<html>
<head>
    <title>Saved Health Reports</title>
    <style>
        body{
            font-family: Arial;
            background: linear-gradient(135deg,#f5f5f5,#e3f2fd);
            padding:30px;
            text-align:center;
        }

        h2{
            color:#1565c0;
            margin-bottom:20px;
        }

        table{
            width:100%;
            border-collapse: collapse;
            background:white;
            box-shadow:0 0 20px rgba(0,0,0,0.1);
            margin-bottom:40px;
        }

        th,td{
            border:1px solid #ccc;
            padding:10px;
            text-align:center;
        }

        th{
            background:#2e7d32;
            color:white;
        }

        .chart-box{
            width:75%;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.1);
        }

        .btn{
            display:inline-block;
            margin-top:25px;
            padding:12px 22px;
            background:#1565c0;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:bold;
        }

        .btn:hover{
            background:#0d47a1;
        }
    </style>
</head>
<body>

<h2>📊 Saved Health Reports + Smart Comparison</h2>

<table>
    <tr>
        <th>S.No</th>
        <th>Age</th>
        <th>Weight</th>
        <th>Height</th>
        <th>BP</th>
        <th>Sugar</th>
        <th>Smoking</th>
        <th>Family History</th>
        <th>Extra Problems</th>
    </tr>

    {% for row in records %}
    <tr>
        <td>{{ loop.index }}</td>   <!-- Serial Number -->
        <td>{{ row[0] }}</td>       <!-- Age -->
        <td>{{ row[1] }}</td>       <!-- Weight -->
        <td>{{ row[2] }}</td>       <!-- Height -->
        <td>{{ row[3] }}</td>       <!-- BP -->
        <td>{{ row[4] }}</td>       <!-- Sugar -->
        <td>{{ row[5] }}</td>       <!-- Smoking -->
        <td>{{ row[6] }}</td>       <!-- Family History -->
        <td>{{ row[7] }}</td>       <!-- Extra Problems -->
    </tr>
    {% endfor %}
</table>

<div class="chart-box">
    <canvas id="healthChart"></canvas>
</div>

<a href="/download_pdf" class="btn">📄 Download PDF Report</a>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.getElementById('healthChart').getContext('2d');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Weight', 'BP', 'Sugar'],
        datasets: [
            {
                label: 'Your Values',
                data: [{{ weight }}, {{ bp }}, {{ sugar }}]
            },
            {
                label: 'Ideal Values',
                data: [{{ ideal_weight }}, {{ ideal_bp }}, {{ ideal_sugar }}]
            }
        ]
    }
});
</script>

</body>
</html>
